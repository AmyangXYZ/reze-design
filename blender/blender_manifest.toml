schema_version = "1.0.0"

# The REZE DESIGN Stage Export add-on as a Blender extension (4.2+). Built by
# build_extension.py, which packs reze_stage_export.py as its __init__.py —
# the single file stays the source, installable either way.
id = "reze_stage_export"
version = "1.0.0"
name = "REZE DESIGN Stage Export"
tagline = "Export a scene as a reze-design stage, lit as Blender lights it"
maintainer = "AmyangXYZ <amyang.xyz@gmail.com>"
type = "add-on"
website = "https://github.com/AmyangXYZ/reze-design"
tags = ["Import-Export", "Material"]
blender_version_min = "4.2.0"
license = ["SPDX:MIT"]

[permissions]
files = "Writes the stage .glb and a temporary copy of the open file"
